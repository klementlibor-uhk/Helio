<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" role="img" aria-labelledby="t d">
  <title id="t">Farma Helio</title>
  <desc id="d">Pole modulů Helio na pobřeží. V popředí jsou moduly nakreslené velké, dozadu se zmenšují do řad. Vlevo je moře, odkud se bere voda, vpravo vede potrubí k městu se sadem.</desc>

  <defs>
    <!-- jeden modul: koule s hladinou, sběrný žlab a nohy -->
    <g id="hm">
      <ellipse cx="0" cy="21" rx="14" ry="2.6" fill="#B6A77C" opacity="0.55"/>
      <path d="M-7 5 L-9.5 19 M7 5 L9.5 19" stroke="#5E6066" stroke-width="2.6" stroke-linecap="round"/>
      <ellipse cx="0" cy="19" rx="10" ry="1.8" fill="none" stroke="#8A8C92" stroke-width="1.4"/>
      <circle cx="0" cy="0" r="12" fill="#E4F0FA" stroke="#7FA9CE" stroke-width="1.1"/>
      <path d="M-12 2 a12 12 0 0 0 24 0 Z" fill="#3B8FE0"/>
      <path d="M-11.5 2 H-5.5 M5.5 2 H11.5" stroke="#1A69B8" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M-5 -7 a7 7 0 0 1 8 -2" fill="none" stroke="#FFFFFF" stroke-width="1.6" opacity="0.8"/>
    </g>
  </defs>

  <!-- obloha, slunce -->
  <rect width="360" height="220" fill="#EAF4FB"/>
  <circle cx="312" cy="26" r="15" fill="#FFCE3A"/>
  <!-- paprsky kolem dokola, vcetne smeru dolu k farme -->
  <g stroke="#F2A81D" stroke-width="2" stroke-linecap="round">
    <path d="M312 4 V0"/><path d="M290 26 H286"/><path d="M334 26 H338"/><path d="M312 48 V52"/>
    <path d="M297 11 L294 8"/><path d="M327 11 L330 8"/><path d="M297 41 L294 44"/><path d="M327 41 L330 44"/>
  </g>
  <!-- delsi paprsky dopadajici na farmu -->
  <g stroke="#F2A81D" stroke-width="1.8" stroke-dasharray="5 4" opacity="0.9">
    <path d="M300 38 L252 118"/><path d="M308 42 L196 96"/>
  </g>

  <!-- moře vlevo -->
  <path d="M0 52 H150 C120 64 80 70 40 74 C26 76 12 78 0 78 Z" fill="#7FC9E0"/>
  <path d="M8 62 h14 M30 68 h12 M52 60 h10" stroke="#B5E2EE" stroke-width="1.6" stroke-linecap="round"/>

  <!-- kopce -->
  <path d="M0 78 C60 66 120 60 200 62 C270 64 320 58 360 52 V96 H0 Z" fill="#CFBD84"/>
  <path d="M0 96 C80 84 160 88 240 82 C300 78 330 80 360 76 V220 H0 Z" fill="#DBCB96"/>
  <path d="M0 132 C90 120 180 126 270 118 C310 114 338 116 360 112 V220 H0 Z" fill="#E3D6A8"/>

  <!-- cesta -->
  <path d="M-6 206 C70 188 150 192 214 172 C268 156 310 142 364 136"
        fill="none" stroke="#EFE6C6" stroke-width="9" stroke-linecap="round"/>

  <!-- město v dáli vpravo -->
  <g>
    <rect x="300" y="84" width="16" height="14" fill="#F3EDE0" stroke="#C9BFA8" stroke-width="0.8"/>
    <path d="M298 84 L308 76 L318 84 Z" fill="#B4705A"/>
    <rect x="320" y="88" width="13" height="10" fill="#F3EDE0" stroke="#C9BFA8" stroke-width="0.8"/>
    <path d="M318 88 L326.5 81 L335 88 Z" fill="#B4705A"/>
    <rect x="286" y="90" width="11" height="8" fill="#F3EDE0" stroke="#C9BFA8" stroke-width="0.8"/>
    <path d="M284 90 L291.5 84 L299 90 Z" fill="#B4705A"/>
    <!-- vodojem -->
    <path d="M340 92 V80 M350 92 V80" stroke="#8A8C92" stroke-width="1.6"/>
    <rect x="336" y="68" width="18" height="12" rx="3" fill="#CFE0EE" stroke="#7FA9CE" stroke-width="1"/>
    <path d="M336 74 h18" stroke="#3B8FE0" stroke-width="2.4"/>
  </g>

  <!-- sad u města -->
  <g>
    <path d="M300 112 V104" stroke="#8A6A3A" stroke-width="2"/><circle cx="300" cy="100" r="6" fill="#9DC070"/>
    <path d="M316 114 V106" stroke="#8A6A3A" stroke-width="2"/><circle cx="316" cy="102" r="6.5" fill="#8FB662"/>
    <path d="M332 112 V105" stroke="#8A6A3A" stroke-width="2"/><circle cx="332" cy="101" r="5.5" fill="#9DC070"/>
    <path d="M346 116 V108" stroke="#8A6A3A" stroke-width="2"/><circle cx="346" cy="104" r="6" fill="#8FB662"/>
  </g>

  <!-- potrubí od farmy k městu -->
  <path d="M196 170 C236 160 268 132 296 110" fill="none" stroke="#6FB6EE" stroke-width="4.5"
        stroke-linecap="round"/>
  <path d="M250 142 l-7 -3 v6 Z" fill="#1A69B8" transform="rotate(-35 250 142)"/>
  <text x="352" y="174" font-size="9" fill="#14558C" font-family="sans-serif" text-anchor="end">pitná voda do města</text>

  <!-- vzdálené řady modulů -->
  <g opacity="0.75">
    <use href="#hm" transform="translate(96 118) scale(0.42)"/>
    <use href="#hm" transform="translate(124 116) scale(0.42)"/>
    <use href="#hm" transform="translate(152 117) scale(0.42)"/>
    <use href="#hm" transform="translate(180 115) scale(0.42)"/>
    <use href="#hm" transform="translate(208 116) scale(0.42)"/>
    <use href="#hm" transform="translate(236 114) scale(0.42)"/>
    <use href="#hm" transform="translate(264 115) scale(0.42)"/>
  </g>
  <g opacity="0.88">
    <use href="#hm" transform="translate(70 134) scale(0.6)"/>
    <use href="#hm" transform="translate(108 132) scale(0.6)"/>
    <use href="#hm" transform="translate(146 133) scale(0.6)"/>
    <use href="#hm" transform="translate(184 131) scale(0.6)"/>
    <use href="#hm" transform="translate(222 132) scale(0.6)"/>
    <use href="#hm" transform="translate(260 130) scale(0.6)"/>
  </g>

  <!-- střední řada -->
  <use href="#hm" transform="translate(52 158) scale(0.85)"/>
  <use href="#hm" transform="translate(104 156) scale(0.85)"/>
  <use href="#hm" transform="translate(156 157) scale(0.85)"/>
  <use href="#hm" transform="translate(208 155) scale(0.85)"/>
  <use href="#hm" transform="translate(260 156) scale(0.85)"/>

  <!-- popředí: moduly poznatelné na první pohled -->
  <use href="#hm" transform="translate(56 196) scale(1.45)"/>
  <use href="#hm" transform="translate(140 200) scale(1.55)"/>
  <use href="#hm" transform="translate(228 194) scale(1.4)"/>

  <!-- přívod mořské vody k farmě -->
  <path d="M10 80 C30 110 34 140 40 176" fill="none" stroke="#1A69B8" stroke-width="4"
        stroke-linecap="round" opacity="0.85"/>
  <text x="42" y="102" font-size="9" fill="#14558C" font-family="sans-serif">mořská voda</text>
</svg>
